# Builds the two images and pushes them to GitHub's container registry (GHCR), so the Mealie PC can
# `docker compose pull` instead of building. Images are private by default and hold no secrets: the
# .env file and the Claude login are mounted at run time.
name: build-images

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "prompts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/Dockerfile.pipeline"
      - "deploy/entrypoint.sh"
      - "inbox_bot/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: pipeline
            context: .
            file: deploy/Dockerfile.pipeline
          - name: inbox
            context: inbox_bot
            file: inbox_bot/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
