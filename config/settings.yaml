# Pipeline settings. Anything here can be overridden by an environment variable or `.env`:
# nested keys use a double underscore, e.g. MEALIE__TIMEOUT_SECONDS=30.
# Secrets (MEALIE_URL, MEALIE_TOKEN, OPENAI_API_KEY, OPENAI_MAX_USD) live only in `.env`.

mealie:
  # Seconds to wait for any single Mealie response.
  timeout_seconds: 20
  # Connection errors are retried this many times (after the first try) with exponential backoff.
  max_retries: 3
  # First backoff delay in seconds; doubles on every retry (1, 2, 4).
  backoff_seconds: 1.0

llm:
  # Seconds to wait for one `claude -p` call.
  timeout_seconds: 600
  # Which `claude --model` alias each tier uses. Uncomment to override the defaults.
  # models:
  #   fast: haiku
  #   strong: sonnet
  #   strongest: opus

images:
  # Seconds to wait when downloading a thumbnail.
  timeout_seconds: 20

verify:
  # The Gate. The Quality Score is 0-100: a weighted average of the checks that apply, minus the
  # LLM judge's penalties. A hard-check failure never uploads, whatever the score.
  upload_at: 80          # at or above: upload
  review_at: 60          # 60-79: upload with the review tag; below, or a hard fail: retry once, then Review Queue
  judge_skip_at: 90      # the LLM judge (one extra Claude call) only runs below this score
  grounding_threshold: 90
  max_dropped_fraction: 0.2
  soft_fail_below: 0.75
  review_tag: To Review
  # weights:
  #   H3: 20   # share of ingredients whose quote was found in the Source
  #   S1: 15   # website vs video agreement (needs a website Source)
  #   S2: 25   # ingredients <-> steps
  #   S3: 15   # parse agreement (needs ticket 09)
  #   S4: 10   # transcript quality (needs a transcript)
  #   S5: 10   # quantity sanity (needs ticket 09)
  #   S6: 15   # plausible times and servings
  # judge_penalties: {blocker: 30, major: 15, minor: 5}

web:
  # Recipe Website fetching (the `scrape` stage). Pages are cached under data/web_cache.
  min_delay_seconds: 2      # wait at least this long between requests to one domain
  timeout_seconds: 20
  max_pages: 3              # candidate links tried per Video
  fetch_pinned_comment: true   # also look for the recipe link in the creator's pinned comment
  robots_allowlist: []      # domains whose robots.txt is not consulted, e.g. your own site

find:
  # Turning a recipe name into the right recipe page (`mp run --stages find`).
  query_templates: {en: "{name} recipe", de: "{name} Rezept", ur: "{name} recipe", hi: "{name} recipe"}
  regions: {en: us-en, de: de-de, ur: pk-en, hi: in-en}
  default_language: en
  search_results: 10        # hits asked of the search source per name
  candidates: 5             # pages fetched per name
  search_delay_seconds: 3   # between two queries to the same source (ddgs can rate-limit)
  accept_score: 0.75        # best candidate at least this ...
  accept_lead: 0.1          # ... and this far ahead of the runner-up, else you pick from the top 3
  accept_first_score: 0.9   # a best candidate at least this good is taken even when others tie it (unset = ask)
  min_name_similarity: 0.35 # a page whose recipe name is less alike than this is not a candidate
  use_claude_fallback: true # claude -p with WebSearch when ddgs fails or finds nothing usable
  # weights: {name: 0.5, structure: 0.15, completeness: 0.2, language: 0.15}
