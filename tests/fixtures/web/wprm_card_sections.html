<!doctype html>
<html lang="en">
<head><title>Dumplings</title></head>
<body>
<div class="wprm-recipe-container">
  <h2 class="wprm-recipe-name">Pork Dumplings</h2>
  <span class="wprm-recipe-servings">24</span>
  <div class="wprm-recipe-image"><img src="placeholder.gif" data-lazy-src="https://dumplings.example/pork.jpg"></div>
  <div class="wprm-recipe-ingredients-container">
    <div class="wprm-recipe-ingredient-group">
      <h4 class="wprm-recipe-group-name">For the dough</h4>
      <ul><li class="wprm-recipe-ingredient">300 g flour</li><li class="wprm-recipe-ingredient">150 ml hot water</li></ul>
    </div>
    <div class="wprm-recipe-ingredient-group">
      <h4 class="wprm-recipe-group-name">For the filling</h4>
      <ul><li class="wprm-recipe-ingredient">250 g minced pork</li><li class="wprm-recipe-ingredient">1 tbsp soy sauce</li></ul>
    </div>
  </div>
  <div class="wprm-recipe-instructions-container">
    <div class="wprm-recipe-instruction-group">
      <h4 class="wprm-recipe-group-name">Dough</h4>
      <ul><li><div class="wprm-recipe-instruction-text">Mix flour and water and knead for 5 minutes.</div></li></ul>
    </div>
    <div class="wprm-recipe-instruction-group">
      <h4 class="wprm-recipe-group-name">Fill and cook</h4>
      <ul><li><div class="wprm-recipe-instruction-text">Fill the wrappers with the pork mixture.</div></li>
          <li><div class="wprm-recipe-instruction-text">Steam for 12 minutes.</div></li></ul>
    </div>
  </div>
</div>
</body>
</html>
