<!doctype html>
<html lang="en">
<head><title>Easy Lentil Soup</title></head>
<body>
<h1>Easy Lentil Soup</h1>
<p>Tasty and cheap.</p>
<div class="tasty-recipes tasty-recipes-1234">
  <img class="tasty-recipes-image" src="x.gif">
  <div class="tasty-recipes-image"><img src="https://soup.example/lentil.jpg"></div>
  <h2 class="tasty-recipes-title">Easy Lentil Soup</h2>
  <span class="tasty-recipes-yield">Serves 4</span>
  <div class="tasty-recipes-ingredients">
    <ul>
      <li>1 cup red lentils</li>
      <li>1 onion, chopped</li>
      <li>4 cups vegetable stock</li>
      <li>1 tsp cumin</li>
    </ul>
  </div>
  <div class="tasty-recipes-instructions">
    <ol>
      <li>Saute the onion with the cumin.</li>
      <li>Add lentils and stock and simmer for 25 minutes.</li>
      <li>Blend until smooth.</li>
    </ol>
  </div>
</div>
</body>
</html>
