<!doctype html>
<html lang="de">
<head><title>Kartoffelsuppe</title></head>
<body>
<div itemscope itemtype="http://schema.org/Recipe">
  <h1 itemprop="name">Kartoffelsuppe</h1>
  <img itemprop="image" src="https://suppe.example/kartoffelsuppe.jpg">
  <meta itemprop="prepTime" content="PT15M">
  <meta itemprop="totalTime" content="PT45M">
  <span itemprop="recipeYield">4 Portionen</span>
  <ul>
    <li itemprop="recipeIngredient">800 g Kartoffeln</li>
    <li itemprop="recipeIngredient">1 Zwiebel</li>
    <li itemprop="recipeIngredient">1 l Gemüsebrühe</li>
  </ul>
  <div itemprop="recipeInstructions">Kartoffeln und Zwiebel würfeln.
Mit der Brühe 25 Minuten kochen.
Pürieren und abschmecken.</div>
</div>
</body>
</html>
